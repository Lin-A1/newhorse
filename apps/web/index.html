<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161616" />
    <title>newhorse</title>
    <script>
      // Set data-theme before first paint (follows OS by default; manual choice
      // in localStorage wins). Mirrors src/theme.ts — keep the two in sync.
      (function () {
        try {
          var pref = localStorage.getItem("NEWHORSE_THEME") || "system"
          var light = pref === "light" || (pref !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches)
          var theme = light ? "light" : "dark"
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
